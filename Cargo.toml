[package]
name = "hft"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-queue = "0.3"
disruptor = "3.6"
itertools = "0.14"
metrics = "0.24"
quanta = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "std",
    "fmt",
    "ansi",
    "tracing-log",
    "parking_lot",
] }
