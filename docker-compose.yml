version: "3.9"

services:
  # Базовый сервис для сборки и общих настроек
  router:
    build:
      context: .
      dockerfile: Dockerfile
    image: hft-app
    # Монтируем директорию для вывода результатов
    volumes:
      - ./results:/app/results
      - ./configs:/app/configs
    # Для высокопроизводительных приложений рекомендуется использовать сеть хоста
    network_mode: "host"
    ipc: "host"
    # Предоставляем расширенные права для управления приоритетами и привязкой к CPU
    cap_add:
      - SYS_NICE
    ulimits:
      memlock: -1
      nofile:
        soft: 65536
        hard: 65536
    # Привязка к CPU может быть настроена здесь для лучшей производительности
    # cpuset: "0-3"

  # Сервис для запуска тестов по сценариям
  router-test:
    extends:
      service: router
    # Команда по умолчанию. Пользователь может переопределить ее,
    # например: docker-compose run router-test ./run_test.sh configs/baseline.json
    command: >
      sh -c "
        echo 'Running all test scenarios...' &&
        ./run_test.sh configs/baseline.json &&
        ./run_test.sh configs/hot_type.json &&
        ./run_test.sh configs/burst_pattern.json &&
        ./run_test.sh configs/imbalanced_processing.json &&
        ./run_test.sh configs/ordering_stress.json &&
        ./run_test.sh configs/strategy_bottleneck.json
      "

  # Сервис для запуска бенчмарков
  router-benchmark:
    extends:
      service: router
    # Команда по умолчанию для запуска бенчмарков с аргументами
    command: ["./run_benchmark.sh"]
    # If no arguments provided, show usage
    # Example: docker-compose run router-benchmark queue_perf
